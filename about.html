<html>
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>About - Blog Reader</title>
<style>
:root {
  --hnfeeds-bg-color: #fafafa;
  --hnfeeds-text-color: #1a1a1a;
  --hnfeeds-header-bg: #ffffff;
  --hnfeeds-card-bg: #ffffff;
  --hnfeeds-accent-color: #ff6600;
  --hnfeeds-secondary-text: #666666;
  --hnfeeds-border-color: #e0e0e0;
  --hnfeeds-hover-bg: #e8e8e8;
}

[data-theme="dark"] {
  --hnfeeds-bg-color: #1a1a1a;
  --hnfeeds-text-color: #e4e4e4;
  --hnfeeds-header-bg: #2d2d2d;
  --hnfeeds-card-bg: #2d2d2d;
  --hnfeeds-accent-color: #ff6600;
  --hnfeeds-secondary-text: #999999;
  --hnfeeds-border-color: #404040;
  --hnfeeds-hover-bg: #3d3d3d;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background-color: var(--hnfeeds-bg-color);
  color: var(--hnfeeds-text-color);
  line-height: 1.6;
  transition: background-color 0.3s ease, color 0.3s ease;
}

.hnfeeds-header {
  background-color: var(--hnfeeds-header-bg);
  border-bottom: 1px solid var(--hnfeeds-border-color);
  padding: 1rem 2rem;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 60px;
}

.hnfeeds-title {
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--hnfeeds-accent-color);
  margin: 0;
}

.hnfeeds-header-nav {
  display: flex;
  gap: 1.5rem;
  margin-left: auto;
  margin-right: 1rem;
}

.hnfeeds-header-nav a {
  color: var(--hnfeeds-text-color);
  text-decoration: none;
  font-size: 0.95rem;
  transition: color 0.2s ease;
}

.hnfeeds-header-nav a:hover {
  color: var(--hnfeeds-accent-color);
}

.hnfeeds-theme-toggle {
  background: none;
  border: 1px solid var(--hnfeeds-border-color);
  color: var(--hnfeeds-text-color);
  padding: 0.5rem 1rem;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: background-color 0.2s ease;
}

.hnfeeds-theme-toggle:hover {
  background-color: var(--hnfeeds-hover-bg);
}

.hnfeeds-main {
  max-width: 800px;
  margin: 80px auto 2rem;
  padding: 2rem;
}

.hnfeeds-about-card {
  background-color: var(--hnfeeds-card-bg);
  border: 1px solid var(--hnfeeds-border-color);
  border-radius: 8px;
  padding: 2rem;
}

.hnfeeds-about-card h2 {
  font-size: 1.5rem;
  margin-bottom: 1.5rem;
  padding-bottom: 0.5rem;
  border-bottom: 2px solid var(--hnfeeds-accent-color);
}

.hnfeeds-about-card p {
  margin-bottom: 1rem;
  font-size: 1rem;
  line-height: 1.7;
}

.hnfeeds-about-card a {
  color: var(--hnfeeds-accent-color);
  text-decoration: none;
}

.hnfeeds-about-card a:hover {
  text-decoration: underline;
}

@media (max-width: 768px) {
  .hnfeeds-header {
    padding: 1rem;
  }
  
  .hnfeeds-header-nav {
    gap: 1rem;
    font-size: 0.9rem;
  }
  
  .hnfeeds-main {
    padding: 1rem;
    margin-top: 70px;
  }
  
  .hnfeeds-about-card {
    padding: 1.5rem;
  }
}
</style>
</head>
<body>
<header class="hnfeeds-header">
  <h1 class="hnfeeds-title">Blog Reader</h1>
  <nav class="hnfeeds-header-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
  </nav>
  <button class="hnfeeds-theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
</header>
<main class="hnfeeds-main">
  <article class="hnfeeds-about-card">
    <h2>About</h2>
    <p>
      This page is generated using an OPML version of the 
      <a href="https://refactoringenglish.com/tools/hn-popularity/">HN Popularity Contest</a> 
      results for 2025, for importing into RSS feed readers.
    </p>
    <p>
      Source for the OPML — 
      <a href="https://gist.github.com/emschwartz/e6d2bf860ccc367fe37ff953ba6de66b">gist.github.com/emschwartz</a>
    </p>
    <p>
      Got the link to the OPML from Andrej Karpathy's 
      <a href="https://x.com/karpathy/status/2018043254986703167">tweet</a>.
    </p>
  </article>
</main>
<script>
function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
}

// Load saved theme
const savedTheme = localStorage.getItem('theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);
</script>
</body>
</html>
